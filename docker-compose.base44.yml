services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "npm install --no-audit --no-fund && export VITE_SUPABASE_URL=\"$$SUPABASE_URL\" VITE_SUPABASE_PUBLISHABLE_KEY=\"$$SUPABASE_PUBLISHABLE_KEY\" && exec npm run dev -- --host 0.0.0.0 --port 3000"
    restart: unless-stopped

volumes:
  node_modules:
