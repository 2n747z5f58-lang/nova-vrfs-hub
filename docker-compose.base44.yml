services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:8080"
    env_file:
      - /run/base44/app.env
    command: >
      sh -c "npm install --no-audit --no-fund &&
      export VITE_SUPABASE_URL="$${SUPABASE_URL}" &&
      export VITE_SUPABASE_PUBLISHABLE_KEY="$${SUPABASE_PUBLISHABLE_KEY}" &&
      npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
